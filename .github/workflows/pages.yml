# Publishes demo/ to GitHub Pages. The ONNX models are pulled from the v1.0.0
# release at deploy time, so no weights are ever committed to git.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ONNX models from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p demo/model
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" -p yolov8n_custom_last.onnx -p yolov8n_coco.onnx -D /tmp/models
          mv /tmp/models/yolov8n_custom_last.onnx demo/model/yolov8n_custom.onnx
          mv /tmp/models/yolov8n_coco.onnx demo/model/yolov8n_coco.onnx
          touch demo/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
